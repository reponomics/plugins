minimum_pre_commit_version: "4.7.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c # v0.17.3
    hooks:
      - id: ruff-format

  - repo: local
    hooks:
      - id: prettier
        name: Format authored text and web files
        entry: npm exec --no -- prettier --write --ignore-unknown
        language: system
        types_or: [markdown, json, yaml, javascript, css, html]
      - id: treestamp-check
        name: Check README directory tree before push
        entry: make treestamp-check
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
      - id: tests
        name: Run project tests before push
        entry: make check
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-ast
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
        args: [--assume-in-merge]
