# Python-only advanced setup for GitHub.com. Read references/codeql.md first.
# Check that CodeQL default setup is disabled before enabling this workflow.
# Replace main with the repository's actual default/protected branch.
name: CodeQL Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 2"
  # Add merge_group when this is a required check in a merge queue.

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # Upload this job's CodeQL results.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          build-mode: none
          # Standard queries first; consider security-extended after triage.
          # For custom config, add config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze and upload results
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:python"
          # A successful upload does not imply zero alerts or enforce merge rules.
