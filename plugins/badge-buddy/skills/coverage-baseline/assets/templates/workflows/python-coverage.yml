# Adapt before use: replace main and {{PYTHON_VERSION}}, preserve the project's
# dependency workflow, and add the coverage config/Makefile target described in
# references/measurement.md. requirements-dev.txt must include test/coverage tools.
# Pin/version pairs verified 2026-10-31; recheck upstream releases when adopting.
# GitHub.com / GitHub-hosted runners; these artifact actions do not support GHES.
name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "{{PYTHON_VERSION}}"
      - name: Install the project's test dependencies
        run: |
          python -m venv venv
          venv/bin/python -m pip install -r requirements-dev.txt
      # Add the existing project's install/build steps here if tests require them.
      - name: Measure the full suite
        run: make coverage PYTHON=venv/bin/python
      - name: Retain reports for this commit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
          retention-days: 14

  codecov:
    needs: coverage
    # Upload the default-branch report used by the README coverage badge.
    # Omit this job for reporting through downloadable CI artifacts alone.
    # See references/reporting.md before adding authenticated or tokenless PR uploads.
    if: >-
      github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC identity, restricted to this upload job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-reports
          path: coverage-reports
      # Run no project install/build/test commands in the upload job.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ./coverage-reports/coverage.xml
          disable_search: true
          disable_file_fixes: true
          plugins: noop
          fail_ci_if_error: true
