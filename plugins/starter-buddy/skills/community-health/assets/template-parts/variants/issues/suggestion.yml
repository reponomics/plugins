name: Suggestion
description: Propose a useful improvement
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What benefit would this bring?
      description: Describe the task or difficulty that motivates your suggestion and who it would help.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Ideas and alternatives
      description: Share a possible solution or anything you have already tried, if you wish. You can submit a suggestion without designing the solution.
