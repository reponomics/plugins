name: Documentation correction
description: Help us improve an explanation or resource
title: "[DOCS]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Where were you looking?
      description: Give a page URL, file path, or section title. For a missing topic, say where you looked for it.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What prevented you from using the documentation?
      description: Identify the inaccurate statement, missing explanation, broken resource, or confusing passage.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: An idea for improving it
      description: You can suggest wording, an example, or a reference here. Leave this blank if you only want to flag the problem.
