name: Suggestion
description: Propose an improvement, feature request, or additional support for another source forge
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What enhancement or additional functionality would you like to see?
      description: Describe the task or difficulty that motivates your suggestion and who it would help. If you host projects outside GitHub, tell us which forge and what the plugins currently get wrong or how they could be improved.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Ideas and alternatives
      description: Share a possible solution or anything you have already tried, if you wish. You can submit a suggestion without designing the solution.
