name: Suggestion
description: Propose an improvement or support for another platform
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What benefit would this bring?
      description: Describe the task or difficulty that motivates your suggestion and who it would help. If you host projects outside GitHub, tell us which forge and what the plugins currently get wrong or leave out for it.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Ideas and alternatives
      description: Share a possible solution or anything you have already tried, if you wish. You can submit a suggestion without designing the solution.
