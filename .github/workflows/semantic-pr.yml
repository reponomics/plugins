name: semantic-pr

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Metadata only: never check out or execute pull-request code here.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
