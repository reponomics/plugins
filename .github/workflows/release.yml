name: release
run-name: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || format('Release from {0}', github.sha) }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Keep each merged release decision available for approval, even if main advances.
concurrency:
  group: release-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
      base: ${{ steps.plan.outputs.base }}
      criteria: ${{ steps.plan.outputs.criteria }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate version decisions and record the exact release commit
        id: plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if test "$GITHUB_EVENT_NAME" = pull_request; then
            base="$(git merge-base "$PR_BASE_SHA" HEAD)"
          elif test "$PUSH_BASE_SHA" = 0000000000000000000000000000000000000000; then
            base=empty
          else
            base="$PUSH_BASE_SHA"
          fi
          make release-plan RELEASE_BASE="$base" RELEASE_HEAD="$GITHUB_SHA"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          plan = json.loads(Path(".cache/releases/plan.json").read_text())
          criteria = any(p["name"] == "badge-buddy" for p in plan["plugins"])
          if plan["base"]:
              difference = subprocess.run([
                  "git", "diff", "--quiet", plan["base"], plan["head"], "--",
                  "plugins/badge-buddy/assets/criteria/",
              ]).returncode
              if difference not in (0, 1):
                  raise SystemExit(difference)
              criteria = criteria or difference == 1
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"releases={str(bool(plan['plugins'])).lower()}", file=output)
              print(f"base={plan['base'] or 'empty'}", file=output)
              print(f"criteria={str(criteria).lower()}", file=output)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print(f"## Release decision\n\nRelease source commit: `{plan['head']}`\n", file=summary)
              for plugin in plan["plugins"]:
                  print(f"- `{plugin['tag']}`", file=summary)
              if not plan["plugins"]:
                  print("No plugin release requested by this change.", file=summary)
              else:
                  print("\nPublication requires passing tests, a clean dependency scan, and owner approval in the release environment.", file=summary)
          PY

  checks:
    needs: validate
    if: github.event_name == 'push' && needs.validate.outputs.releases == 'true' && vars.RELEASE_REPOSITORY == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: make check

  scan:
    needs: validate
    if: github.event_name == 'push' && needs.validate.outputs.releases == 'true' && vars.RELEASE_REPOSITORY == github.repository
    uses: ./.github/workflows/dependency-scan.yml

  # Advisory only: upstream changes or outages cannot veto an accepted release.
  criteria:
    needs: validate
    if: needs.validate.outputs.criteria == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Download current criteria
        id: download
        continue-on-error: true
        run: make download-criteria
      - name: Compare the accepted catalog with the current site
        id: compare
        if: steps.download.outcome == 'success'
        continue-on-error: true
        run: make compare-criteria
      - name: Report advisory outcome
        if: always()
        env:
          DOWNLOAD: ${{ steps.download.outcome }}
          COMPARISON: ${{ steps.compare.outcome }}
        run: |
          if test "$DOWNLOAD" != success; then
            message='Live criteria could not be checked. Release publication is unaffected.'
            echo "::warning::$message"
          elif test "$COMPARISON" != success; then
            message='Live criteria differ or comparison failed. Review the criteria evidence; release publication is unaffected.'
            echo "::warning::$message"
          else
            message='The accepted criteria catalog matches the current site.'
          fi
          printf '## Criteria freshness (advisory)\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve criteria evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criteria-advisory-${{ github.run_attempt }}
          path: .cache/criteria/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [validate, checks, scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.outputs.releases == 'true' && vars.RELEASE_REPOSITORY == github.repository
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Load the exact commit that passed verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch dependency evidence from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.scan.outputs.artifact-id }}
          path: ${{ runner.temp }}/evidence
          merge-multiple: true
      - name: Create tags, publish and verify immutable releases
        env:
          RELEASE_BASE: ${{ needs.validate.outputs.base }}
          GH_TOKEN: ${{ github.token }}
        run: |
          make release-publish RELEASE_BASE="$RELEASE_BASE" RELEASE_HEAD="$GITHUB_SHA" REPO="$GITHUB_REPOSITORY" RELEASE_EVIDENCE="$RUNNER_TEMP/evidence"
