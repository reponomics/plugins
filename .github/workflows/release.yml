name: release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Prepare {0}', inputs.tag) || github.event.pull_request.title }}

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SSH-signed PLUGIN--vVERSION tag on main
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate version decisions and reviewed notes
        id: plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$(git merge-base "$PR_BASE_SHA" HEAD)"
          make release-plan RELEASE_BASE="$base"
          cat .cache/releases/plan.json
          if git diff --quiet "$base" HEAD -- plugins/badge-buddy/assets/criteria/; then
            echo "criteria=false" >> "$GITHUB_OUTPUT"
          else
            echo "criteria=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify changed criteria against the live application
        if: steps.plan.outputs.criteria == 'true'
        run: |
          make checkout-upstream BADGE_REPO="$RUNNER_TEMP/badgeapp"
          make download-criteria
          make check-criteria BADGE_REPO="$RUNNER_TEMP/badgeapp"

  preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.tag.outputs.head }}
      object: ${{ steps.tag.outputs.object }}
      plugin: ${{ steps.tag.outputs.plugin }}
    steps:
      # The workflow and helpers come from the dispatch SHA on protected main.
      - name: Require the enabled repository and protected main branch
        env:
          ENABLED_REPOSITORY: ${{ vars.RELEASE_REPOSITORY }}
        run: test "$GITHUB_REF" = refs/heads/main && test "$ENABLED_REPOSITORY" = "$GITHUB_REPOSITORY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag object, signer, manifest, ancestry and notes
        id: tag
        env:
          TAG: ${{ inputs.tag }}
          ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
        run: |
          printf '%s\n' "$ALLOWED_SIGNERS" > "$RUNNER_TEMP/allowed_signers"
          python3 -I tools/plugin_release.py verify-tag --tag "$TAG" --allowed-signers "$RUNNER_TEMP/allowed_signers" >> "$GITHUB_OUTPUT"

  checks:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.RELEASE_REPOSITORY == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Load the verifier from the dispatch commit on main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reverify the signed tag and bind it to preflight before checkout
        id: verified
        env:
          TAG: ${{ inputs.tag }}
          ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
          EXPECTED_OBJECT: ${{ needs.preflight.outputs.object }}
          EXPECTED_HEAD: ${{ needs.preflight.outputs.head }}
        run: |
          printf '%s\n' "$ALLOWED_SIGNERS" > "$RUNNER_TEMP/allowed_signers"
          python3 -I tools/plugin_release.py verify-tag --tag "$TAG" --allowed-signers "$RUNNER_TEMP/allowed_signers" --expected-object "$EXPECTED_OBJECT" --expected-head "$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"
      - name: Check out only the locally verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.verified.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: make check
      - name: Verify Badge Buddy criteria for this release
        if: steps.verified.outputs.plugin == 'badge-buddy'
        run: |
          make checkout-upstream BADGE_REPO="$RUNNER_TEMP/badgeapp"
          make download-criteria
          make check-criteria BADGE_REPO="$RUNNER_TEMP/badgeapp"

  scan:
    needs: preflight
    uses: ./.github/workflows/dependency-scan.yml
    with:
      commit: ${{ needs.preflight.outputs.head }}

  draft:
    needs: [preflight, checks, scan]
    if: github.ref == 'refs/heads/main' && vars.RELEASE_REPOSITORY == github.repository
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.scan.outputs.artifact-id }}
          path: ${{ runner.temp }}/evidence
          merge-multiple: true
      - name: Prepare the unpublished release from checked evidence
        env:
          TAG: ${{ inputs.tag }}
          OBJECT: ${{ needs.preflight.outputs.object }}
          ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$ALLOWED_SIGNERS" > "$RUNNER_TEMP/allowed_signers"
          python3 -I tools/plugin_release.py draft --tag "$TAG" --allowed-signers "$RUNNER_TEMP/allowed_signers" --object "$OBJECT" --repository "$GITHUB_REPOSITORY" --evidence "$RUNNER_TEMP/evidence" --receipt "$RUNNER_TEMP/receipt.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-subject-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: error
      - name: Record the maintainer finalization command
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "Draft ready. Inspect it, then run:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`make release-finalize REPO=$GITHUB_REPOSITORY TAG=$TAG RUN=$GITHUB_RUN_ID\`" >> "$GITHUB_STEP_SUMMARY"
